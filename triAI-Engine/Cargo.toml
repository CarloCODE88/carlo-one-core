[package]
name = "tri-ai-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
toml = "0.8"
ureq = "2.12.1"
url = "2.5.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
regex = "1.10"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "macros", "rt", "rt-multi-thread"] }
tracing = "0.1"
sysinfo = "0.30"
sha2 = "0.10"
zstd = "0.13"
memmap2 = "0.9"
rayon = "1.12.0"
reqwest = { version = "0.12", features = ["json"] }
futures = "0.3"
flate2 = "1.0"

[[bin]]
name = "tri-model-pack"
path = "src/bin/tri_model_pack.rs"

[[bin]]
name = "tri-quality-gates"
path = "src/bin/tri_quality_gates.rs"

[[bin]]
name = "tri-chunk-bench"
path = "src/bin/tri_chunk_bench.rs"

[[bench]]
name = "startup"
harness = false

[[bench]]
name = "inference"
harness = false

[[bench]]
name = "chunk_load"
harness = false

[[bench]]
name = "warmup"
harness = false

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
